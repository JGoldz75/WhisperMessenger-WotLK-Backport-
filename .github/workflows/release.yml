name: Package WotLK and publish GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release tag and extract player notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "Release tag must be vX.Y.Z"
          toc = Path("WhisperMessenger.toc").read_text(encoding="utf-8")
          assert re.search(r"(?m)^## Interface: 30300$", toc), "This release must target original Wrath"
          version = re.search(r"(?m)^## Version: (.+)$", toc)
          assert version and version.group(1) == tag, "Tag and addon version do not match"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(r"(?m)^## \[" + re.escape(tag[1:]) + r"\][^\n]*\n", changelog)
          assert heading, "No changelog section found for the release tag"
          notes = re.split(r"(?m)^## ", changelog[heading.end():], maxsplit=1)[0].strip()
          assert notes, "Release notes are empty"
          (Path(os.environ["RUNNER_TEMP"]) / "wotlk-release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Build installable WotLK package
        run: |
          python scripts/package_wotlk.py
          sha256sum dist/*.zip > dist/SHA256SUMS
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: WhisperMessenger-WotLK-3.3.5a-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release on this GitHub fork
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/wotlk-release-notes.md"
